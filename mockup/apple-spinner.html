<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SVG-яблоко с вращением по оси Z</title>
  <!-- Превью компонента src/components/AppleSpinner.vue. Открывается в браузере без сборки. -->
  <style>
    :root {
      --bg-base: #121212;
      --primary: #ff7a00;
      --primary-hover: #ff9433;
      --text: #e8e8e8;
      --apple-speed: 3s;
    }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; gap: 3rem;
      background: var(--bg-base); color: var(--text);
      font-family: 'Open Sans', Helvetica, Arial, sans-serif;
    }
    .apple-spinner { display: inline-block; width: 10rem; height: 10rem; }
    .apple-spin {
      transform-box: fill-box;
      transform-origin: center;
      animation: apple-rotate-z var(--apple-speed) linear infinite;
    }
    .apple-body  { fill: var(--primary); }
    .apple-leaf  { fill: var(--primary-hover); }
    .apple-stem  { stroke: var(--text); }
    .apple-shine { fill: var(--text); }

    /* вращение вокруг оси Z = поворот в плоскости экрана */
    @keyframes apple-rotate-z {
      from { transform: rotateZ(0deg); }
      to   { transform: rotateZ(360deg); }
    }
    .small { width: 4rem; height: 4rem; }
  </style>
</head>
<body>
  <svg class="apple-spinner" viewBox="0 0 100 100" role="img" aria-label="Яблоко">
    <g class="apple-spin">
      <path class="apple-leaf" d="M52 24 C54 14 62 9 72 11 C70 21 62 27 52 28 Z" />
      <path class="apple-stem" d="M50 26 C49 19 50 14 54 11" fill="none" stroke-width="3" stroke-linecap="round" />
      <path class="apple-body" d="M50 30 C42 22 28 24 24 36 C20 48 26 70 38 80 C44 85 47 82 50 82 C53 82 56 85 62 80 C74 70 80 48 76 36 C72 24 58 22 50 30 Z" />
      <path class="apple-shine" d="M36 40 C32 44 31 52 34 58 C30 50 31 42 36 40 Z" opacity="0.5" />
    </g>
  </svg>

  <svg class="apple-spinner small" viewBox="0 0 100 100" role="img" aria-label="Яблоко">
    <g class="apple-spin">
      <path class="apple-leaf" d="M52 24 C54 14 62 9 72 11 C70 21 62 27 52 28 Z" />
      <path class="apple-stem" d="M50 26 C49 19 50 14 54 11" fill="none" stroke-width="3" stroke-linecap="round" />
      <path class="apple-body" d="M50 30 C42 22 28 24 24 36 C20 48 26 70 38 80 C44 85 47 82 50 82 C53 82 56 85 62 80 C74 70 80 48 76 36 C72 24 58 22 50 30 Z" />
      <path class="apple-shine" d="M36 40 C32 44 31 52 34 58 C30 50 31 42 36 40 Z" opacity="0.5" />
    </g>
  </svg>
</body>
</html>
