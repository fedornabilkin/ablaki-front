<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="appleBase" cx="38%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#ffd34a"/>
      <stop offset="18%" stop-color="#ff9a00"/>
      <stop offset="48%" stop-color="#ff5a00"/>
      <stop offset="78%" stop-color="#e93600"/>
      <stop offset="100%" stop-color="#8f1600"/>
    </radialGradient>

    <linearGradient id="hot" x1="0" y1="1" x2="0.65" y2="0">
      <stop offset="0%" stop-color="#ff3a00"/>
      <stop offset="38%" stop-color="#ff7a00"/>
      <stop offset="72%" stop-color="#ffc400"/>
      <stop offset="100%" stop-color="#fff27a"/>
    </linearGradient>

    <linearGradient id="hot2" x1="0.15" y1="1" x2="0.8" y2="0">
      <stop offset="0%" stop-color="#ff5400"/>
      <stop offset="46%" stop-color="#ff9a00"/>
      <stop offset="100%" stop-color="#ffe96a"/>
    </linearGradient>

    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#e63500"/>
      <stop offset="40%" stop-color="#ff6a00"/>
      <stop offset="75%" stop-color="#ffa700"/>
      <stop offset="100%" stop-color="#ffe45e"/>
    </linearGradient>

    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffae00"/>
      <stop offset="35%" stop-color="#8d3200"/>
      <stop offset="65%" stop-color="#4b1900"/>
      <stop offset="100%" stop-color="#ff7b00"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="appleClip">
